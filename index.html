<!DOCTYPE html>
<html lang="zh-CN">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Hello</title>
  <style>
    :root { color-scheme: light dark; }
    * { box-sizing: border-box; }
    body {
      margin: 0; min-height: 100vh;
      display: flex; align-items: center; justify-content: center;
      font-family: -apple-system, "PingFang SC", "Microsoft YaHei", sans-serif;
      background: #f6f7f9; color: #1a1a1a;
    }
    main { max-width: 640px; padding: 40px 24px; }
    h1 { font-size: 2rem; margin: 0 0 8px; letter-spacing: .5px; }
    p.sub { color: #666; margin: 0 0 28px; }
    ul { padding-left: 20px; line-height: 2; }
    a { color: #0969da; text-decoration: none; }
    a:hover { text-decoration: underline; }
    footer { margin-top: 40px; font-size: 13px; color: #999; }
    @media (prefers-color-scheme: dark) {
      body { background: #0d1117; color: #e6edf3; }
      p.sub { color: #9198a1; }
      footer { color: #6e7681; }
      a { color: #4493f8; }
    }
  </style>
</head>
<body>
  <main>
    <h1>dtceca</h1>
    <p class="sub">个人主页 · 建设中</p>
    <ul>
      <li><a href="https://github.com/dtceca">GitHub 主页</a></li>
      <li><a href="./notes/">项目笔记</a></li>
    </ul>
    <footer>© 2026 dtceca</footer>
  </main>
</body>
</html>
